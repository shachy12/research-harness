appId: com.harness.app
productName: Harness
directories:
  output: release
# Everything the main process needs is bundled into dist/main.mjs (server included), so no node_modules.
files:
  - dist/main.mjs
  - package.json
  - "!**/node_modules/**"
extraResources:
  - from: ../web/dist
    to: web
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
